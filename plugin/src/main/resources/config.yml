# UltimateQuest by PQguanfang
#
# Read the Wiki here: https://enchantedmobs.superiormc.cn/for-ultimatequest

config-files:
  language: en_US
  per-player-language: true
  force-parse-mini-message: false

math:
  enabled: true
  enable-function: true

debug: false

# Progress feedback for tasks, scrolls, battle passes and milestones.
# Each definition can override these fields under progress-feedback, or set it to false.
# BossBar color falls back to the first category with a configured color, then this global value.
task-progress:
  enabled: true
  cooldown-ticks: 5
  # Supported modes: BOSS_BAR, ACTION_BAR, BOTH.
  display: BOSS_BAR
  actionbar: '[actionbar]{lang:quest-progress}[/actionbar]'
  bossbar:
    title: '{lang:quest-progress}'
    color: BLUE
    style: SOLID
  sound:
    name: 'minecraft:entity.experience_orb.pickup'
    volume: 0.25
    pitch: 1.35

hook-item-method: DEFAULT

# Automatic saving, using the same option names as UltimateShop.
# 20 ticks = 1 second. Quitting, reward claims and shutdown still save data.
auto-save:
  enabled: true
  hide-message: false
  period-tick: 6000
  message: '{lang:auto-save.message}'

# Task slots per player. -1 = unlimited; 0 = disabled.
# Completed tasks waiting for reward claims still occupy slots.
# Battle pass / milestone reward-track containers do not occupy task slots.
task-limits:
  normal:
    total: 20
    categories:
      combat: 6
      gathering: 10

  scroll:
    total: 8
    categories:
      adventure: 4
      gathering: 4

  period:
    # Daily 3 + weekly 3 + monthly 8, with room for completed tasks in claim grace.
    total: 28
    categories: {}

  battlepass-task:
    total: -1
    categories: {}

  # Optional category caps across all task types.
  categories:
    combat: -1
    gathering: -1
    uncategorized: -1

  # Optional permission-based increases. Each cap uses the highest matching value,
  # including the default above; -1 wins. Omitted caps keep their default.
  permission-limits: {}
  # permission-limits:
  #   vip:
  #     permission: ultimatequest.limits.vip
  #     normal:
  #       total: 30
  #       categories:
  #         combat: 10
  #   svip:
  #     permission: ultimatequest.limits.svip
  #     normal:
  #       total: 50
  #     scroll:
  #       total: 16

