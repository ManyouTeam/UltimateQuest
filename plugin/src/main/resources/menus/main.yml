enabled: true
permission: ultimatequest.use
title: '{lang:menu-title}'
layout:
- FFFFSFFFF
- FQQQQQQQF
- FQQQQQQQF
- FQQQQQQQF
- FBFTFMFWF
- PKFVCRFFN
view-filter:
  values: [ALL, ACTIVE, AVAILABLE, CLAIMABLE, CLAIMED]
category-filter:
  enabled: true
  open-on-start: false
  hide-empty: true
contents:
  Q:
    type: quests
    filterable: true
    sort: actionable
    use-quest-icon: true
    include: []
    exclude: []
    categories: []
    item:
      name: '{lang:defaults.ui.quest-name}'
      lore:
      - '{lang:defaults.ui.description}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.menus.main.contents.q.item.lore.2}'
      - '{lang:defaults.ui.objectives}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.progress}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.hint}'
      - '{lang:defaults.ui.reward-title}'
      - '{lang:defaults.ui.rewards}'
      - '{lang:defaults.ui.task-categories}'
      - '{lang:defaults.ui.task-prerequisites}'
    state-items:
      COMPLETED:
        material: CHEST_MINECART
        name: '{lang:defaults.ui.menus.main.contents.q.state-items.completed.name}'
        glow: true
        lore:
        - '{lang:defaults.ui.description}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.menus.main.contents.q.item.lore.2}'
        - '{lang:defaults.ui.objectives}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.progress}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.hint}'
        - '{lang:defaults.ui.reward-title}'
        - '{lang:defaults.ui.rewards}'
        - '{lang:defaults.ui.task-categories}'
        - '{lang:defaults.ui.task-prerequisites}'
      LOCKED:
        material: BARRIER
        name: '{lang:defaults.ui.menus.main.contents.q.state-items.locked.name}'
        lore:
        - '{lang:defaults.ui.description}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.menus.main.contents.q.item.lore.2}'
        - '{lang:defaults.ui.objectives}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.progress}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.hint}'
        - '{lang:defaults.ui.reward-title}'
        - '{lang:defaults.ui.rewards}'
        - '{lang:defaults.ui.task-categories}'
        - '{lang:defaults.ui.task-prerequisites}'
      ABANDON_CONFIRM:
        material: RED_STAINED_GLASS_PANE
        name: '{lang:menu-abandon-confirm-title}'
        glow: true
        lore:
        - '{lang:menu-abandon-confirm-loss}'
        - '{lang:defaults.ui.blank}'
        - '{lang:menu-abandon-confirm-action}'
        - '{lang:menu-abandon-confirm-cancel}'
        - '{lang:menu-abandon-confirm-timeout}'
    empty-item:
      material: MINECART
      name: '{lang:menu-empty-title}'
      lore:
      - '{lang:menu-empty-description}'
    click-actions:
      LEFT:
        interact:
          type: quest
      RIGHT:
        abandon:
          type: abandon_quest
          confirm: true
          confirm-seconds: 5
items:
  K:
    item:
      material: CHEST
      name: '{lang:category.button}'
      lore:
      - '{lang:category.current}'
      - '{lang:category.select}'
    actions:
      category:
        type: open_categories
  F:
    item:
      material: BLACK_STAINED_GLASS_PANE
      name: '{lang:defaults.ui.blank}'
  S:
    item:
      material: WRITABLE_BOOK
      name: '{lang:menu-summary-title}'
      lore:
      - '{lang:menu-summary-total}'
      - '{lang:defaults.ui.blank}'
      - '{lang:menu-summary-active}'
      - '{lang:menu-summary-claimable}'
      - '{lang:menu-summary-available}'
      - '{lang:menu-summary-locked}'
      - '{lang:defaults.guide.accept}'
      - '{lang:defaults.guide.progress}'
      - '{lang:defaults.guide.modes}'
  P:
    hide-on-first-page: true
    item:
      material: ARROW
      name: '{lang:menu-previous}'
      lore:
      - '{lang:defaults.ui.page-number}'
    hidden-item:
      material: BLACK_STAINED_GLASS_PANE
      name: '{lang:defaults.ui.blank}'
    actions:
      page:
        type: previous_page
  N:
    hide-on-last-page: true
    item:
      material: ARROW
      name: '{lang:menu-next}'
      lore:
      - '{lang:defaults.ui.page-number}'
    hidden-item:
      material: BLACK_STAINED_GLASS_PANE
      name: '{lang:defaults.ui.blank}'
    actions:
      page:
        type: next_page
  V:
    view-items:
      ALL:
        material: HOPPER
        name: '{lang:menu-filter-title}'
        lore:
        - '{lang:menu-filter-all}'
        - '{lang:defaults.ui.blank}'
        - '{lang:menu-filter-switch}'
      ACTIVE:
        material: COMPASS
        name: '{lang:menu-filter-title}'
        lore:
        - '{lang:menu-filter-active}'
        - '{lang:defaults.ui.blank}'
        - '{lang:menu-filter-switch}'
      AVAILABLE:
        material: BOOK
        name: '{lang:menu-filter-title}'
        lore:
        - '{lang:menu-filter-available}'
        - '{lang:defaults.ui.blank}'
        - '{lang:menu-filter-switch}'
      CLAIMABLE:
        material: CHEST_MINECART
        name: '{lang:menu-filter-title}'
        lore:
        - '{lang:menu-filter-claimable}'
        - '{lang:defaults.ui.blank}'
        - '{lang:menu-filter-switch}'
      CLAIMED:
        material: MINECART
        name: '{lang:menu-filter-title}'
        lore:
        - '{lang:menu-filter-claimed}'
        - '{lang:defaults.ui.blank}'
        - '{lang:menu-filter-switch}'
    actions:
      filter:
        type: cycle_view
  C:
    item:
      material: BARRIER
      name: '{lang:menu-close}'
    actions:
      close:
        type: close
  R:
    item:
      material: SUNFLOWER
      name: '{lang:menu-refresh}'
      lore:
      - '{lang:menu-refresh-description}'
    actions:
      refresh:
        type: refresh
  B:
    item:
      material: EXPERIENCE_BOTTLE
      name: '{lang:progression.battlepass}'
      lore:
      - '{lang:menu-open-battlepass}'
    actions:
      open:
        type: open_menu
        menu: battlepass
  M:
    item:
      material: STONE_PICKAXE
      name: '{lang:progression.milestone}'
      lore:
      - '{lang:menu-open-milestone}'
    actions:
      open:
        type: open_menu
        menu: milestone
  T:
    item:
      material: CLOCK
      name: '{lang:period.title}'
      lore:
      - '{lang:menu-open-period}'
    actions:
      open:
        type: open_menu
        menu: period
  W:
    item:
      material: MAP
      name: '{lang:scroll.title}'
      lore:
      - '{lang:menu-open-scroll}'
    actions:
      open:
        type: open_menu
        menu: scroll
