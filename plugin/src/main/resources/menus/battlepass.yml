enabled: true
permission: ultimatequest.use
catalog-title: '{lang:defaults.ui.menus.battlepass.catalog-title}'
detail-title: '{lang:defaults.ui.menus.battlepass.detail-title}'
catalog-layout:
- FFFFSFFFF
- FAAAAAAAF
- FAAAAAAAF
- FAAAAAAAF
- FFFFFFFFF
- PKFHCXFFN
detail-layout:
- FFFFDFFFF
- FQQQQQQQF
- FLLLLLLLF
- FRRRRRRRF
- FFFFFFFFF
- PIFBCXFGN
challenge-layout:
- FFFFDFFFF
- FJJJJJJJF
- FJJJJJJJF
- FJJJJJJJF
- FFFFFFFFF
- PKYBCXFVN
category-filter:
  enabled: true
  hide-empty: true
contents:
  J:
    display: challenges
    type: challenge
    filterable: true
    categories: []
    sort: actionable
    use-quest-icon: true
    item:
      name: '{lang:defaults.ui.quest-name}'
      lore:
      - '{lang:defaults.ui.description}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.menus.battlepass.contents.j.item.lore.2}'
      - '{lang:defaults.ui.objectives}'
      - '{lang:defaults.ui.progress}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.menus.battlepass.contents.j.item.lore.6}'
      - '{lang:defaults.ui.menus.battlepass.contents.j.item.lore.7}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.hint}'
    empty-item:
      material: CLOCK
      name: '{lang:menu-empty-title}'
      lore:
      - '{lang:progression.challenges-empty}'
    click-actions:
      LEFT:
        interact:
          type: quest
      RIGHT:
        info:
          type: quest_info
  A:
    display: catalog
    type: battlepass
    sort: actionable
    use-quest-icon: true
    include: []
    exclude: []
    catalog-item:
      name: '{lang:defaults.ui.menus.battlepass.contents.a.catalog-item.name}'
      lore:
      - '{lang:defaults.ui.description}'
      - '{lang:defaults.ui.objectives}'
      - '{lang:defaults.ui.blank}'
      - '{lang:progression.season}'
      - '{lang:progression.summary}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.hint}'
    empty-item:
      material: MINECART
      name: '{lang:menu-empty-title}'
      lore:
      - '{lang:menu-empty-battlepass}'
    click-actions:
      LEFT:
        open:
          type: quest
  Q:
    display: detail
    type: battlepass
    track: free
    sort: natural
    use-quest-icon: false
    item:
      material: MINECART
      name: '{lang:defaults.ui.menus.battlepass.contents.q.item.name}'
      lore:
      - '{lang:progression.required}'
      - '{lang:defaults.ui.progress}'
      - '{lang:defaults.ui.blank}'
      - '{lang:progression.rewards-title}'
      - '{lang:defaults.ui.rewards}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.state}'
    state-items:
      AVAILABLE:
        material: CHEST_MINECART
        name: '{lang:defaults.ui.menus.battlepass.contents.q.state-items.available.name}'
        glow: true
        lore:
        - '{lang:progression.required}'
        - '{lang:defaults.ui.progress}'
        - '{lang:defaults.ui.blank}'
        - '{lang:progression.rewards-title}'
        - '{lang:defaults.ui.rewards}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.menus.battlepass.contents.q.state-items.available.lore.6}'
      CLAIMED:
        material: MINECART
        name: '{lang:defaults.ui.menus.battlepass.contents.q.state-items.claimed.name}'
        lore:
        - '{lang:progression.required}'
        - '{lang:defaults.ui.progress}'
        - '{lang:defaults.ui.blank}'
        - '{lang:progression.rewards-title}'
        - '{lang:defaults.ui.rewards}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.state}'
    click-actions:
      LEFT:
        claim:
          type: quest
  L:
    display: detail
    type: battlepass
    track: free
    sort: natural
    use-quest-icon: false
    item:
      material: GRAY_STAINED_GLASS_PANE
      name: '{lang:defaults.ui.menus.battlepass.contents.l.item.name}'
      lore:
      - '{lang:progression.required}'
    state-items:
      AVAILABLE:
        material: LIME_STAINED_GLASS_PANE
        name: '{lang:defaults.ui.menus.battlepass.contents.l.state-items.available.name}'
        glow: true
        lore:
        - '{lang:progression.required}'
        - '{lang:defaults.ui.state}'
      CLAIMED:
        material: LIGHT_BLUE_STAINED_GLASS_PANE
        name: '{lang:defaults.ui.menus.battlepass.contents.l.state-items.claimed.name}'
        lore:
        - '{lang:progression.required}'
        - '{lang:defaults.ui.state}'
      CLAIMING:
        material: YELLOW_STAINED_GLASS_PANE
        name: '{lang:defaults.ui.menus.battlepass.contents.l.state-items.claiming.name}'
        lore:
        - '{lang:defaults.ui.state}'
      REVIEW:
        material: RED_STAINED_GLASS_PANE
        name: '{lang:defaults.ui.menus.battlepass.contents.l.state-items.review.name}'
        lore:
        - '{lang:defaults.ui.state}'
  R:
    display: detail
    type: battlepass
    track: premium
    sort: natural
    use-quest-icon: false
    item:
      material: BARREL
      name: '{lang:defaults.ui.menus.battlepass.contents.r.item.name}'
      lore:
      - '{lang:progression.required}'
      - '{lang:defaults.ui.progress}'
      - '{lang:defaults.ui.blank}'
      - '{lang:progression.rewards-title}'
      - '{lang:defaults.ui.rewards}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.state}'
    state-items:
      AVAILABLE:
        material: ENDER_CHEST
        name: '{lang:defaults.ui.menus.battlepass.contents.r.state-items.available.name}'
        glow: true
        lore:
        - '{lang:progression.required}'
        - '{lang:defaults.ui.progress}'
        - '{lang:defaults.ui.blank}'
        - '{lang:progression.rewards-title}'
        - '{lang:defaults.ui.rewards}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.menus.battlepass.contents.r.state-items.available.lore.6}'
      PREMIUM_REQUIRED:
        material: BARRIER
        name: '{lang:defaults.ui.menus.battlepass.contents.r.state-items.premium_required.name}'
        lore:
        - '{lang:progression.required}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.state}'
      CLAIMED:
        material: CHEST
        name: '{lang:defaults.ui.menus.battlepass.contents.r.state-items.claimed.name}'
        lore:
        - '{lang:progression.required}'
        - '{lang:defaults.ui.progress}'
        - '{lang:defaults.ui.blank}'
        - '{lang:progression.rewards-title}'
        - '{lang:defaults.ui.rewards}'
        - '{lang:defaults.ui.blank}'
        - '{lang:defaults.ui.state}'
    click-actions:
      LEFT:
        claim:
          type: quest
items:
  K:
    item:
      material: CHEST
      name: '{lang:category.button}'
      lore:
      - '{lang:category.current}'
    actions:
      category:
        type: open_categories
  V:
    display: challenges
    item:
      material: HOPPER
      name: '{lang:category.status}'
    actions:
      view:
        type: cycle_view
  Y:
    display: challenges
    item:
      material: HOPPER
      name: '{lang:defaults.ui.menus.battlepass.items.y.item.name}'
      lore:
      - '{lang:defaults.ui.menus.battlepass.items.y.item.lore.0}'
      - '{lang:defaults.ui.menus.battlepass.items.y.item.lore.1}'
    actions:
      group:
        type: cycle_challenge_group
  I:
    display: detail
    item:
      material: CHEST_MINECART
      name: '{lang:progression.claim-all}'
    actions:
      claim:
        type: claim_all
  G:
    display: detail
    item:
      material: KNOWLEDGE_BOOK
      name: '{lang:progression.challenges}'
    actions:
      open:
        type: open_challenges
  F:
    item:
      material: BLACK_STAINED_GLASS_PANE
      name: '{lang:defaults.ui.blank}'
  S:
    display: catalog
    item:
      material: NETHER_STAR
      name: '{lang:progression.catalog-title}'
      lore:
      - '{lang:progression.catalog-count}'
      - '{lang:defaults.ui.blank}'
      - '{lang:progression.catalog-description}'
  D:
    item:
      material: EXPERIENCE_BOTTLE
      name: '{lang:defaults.ui.menus.battlepass.contents.a.catalog-item.name}'
      lore:
      - '{lang:defaults.ui.objectives}'
      - '{lang:defaults.ui.blank}'
      - '{lang:progression.season}'
      - '{lang:progression.summary}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.progress}'
      - '{lang:defaults.ui.blank}'
      - '{lang:defaults.ui.blank}'
      - '{lang:progression.claimable-summary}'
      - '{lang:progression.next-level}'
      - '{lang:progression.time-left}'
  P:
    hide-on-first-page: true
    item:
      material: ARROW
      name: '{lang:menu-previous}'
      lore:
      - '{lang:defaults.ui.page-number}'
    hidden-item:
      material: BLACK_STAINED_GLASS_PANE
      name: '{lang:defaults.ui.blank}'
    actions:
      page:
        type: previous_page
  N:
    hide-on-last-page: true
    item:
      material: ARROW
      name: '{lang:menu-next}'
      lore:
      - '{lang:defaults.ui.page-number}'
    hidden-item:
      material: BLACK_STAINED_GLASS_PANE
      name: '{lang:defaults.ui.blank}'
    actions:
      page:
        type: next_page
  H:
    display: catalog
    item:
      material: COMPASS
      name: '{lang:menu-back}'
    actions:
      open:
        type: open_menu
        menu: main
  B:
    display: detail
    item:
      material: KNOWLEDGE_BOOK
      name: '{lang:menu-back-catalog}'
    actions:
      open:
        type: open_menu
        menu: battlepass
  C:
    item:
      material: BARRIER
      name: '{lang:menu-close}'
    actions:
      close:
        type: close
  X:
    item:
      material: SUNFLOWER
      name: '{lang:menu-refresh}'
      lore:
      - '{lang:menu-refresh-description}'
    actions:
      refresh:
        type: refresh
